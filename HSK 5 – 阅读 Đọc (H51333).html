</main><script>
const C={"id": "doc", "cn": "阅读", "vi": "Đọc", "min": 45, "notes": ["45 câu (46–90), mỗi câu 100/45 điểm, tổng 100 điểm. Có thể chuyển qua lại giữa các phần."], "sections": [{"h": "第一部分 · 第46–60题", "vi": "Chọn đáp án đúng để điền vào chỗ trống.", "items": [{"t": "m", "n": 46, "opts": ["事物", "物质", "原料", "资源"], "ans": "B", "pts": 2.2222222222222223, "pre": "冬天，许多湖泊和河流都会结冰，但海水却极少结冰，这是为什么呢？原来，一般情况下，水在零度就会结冰，但如果水里溶入了一些其他[46]，例如盐，那么它结冰的温度就会降到零度以下。由于海水里面[47]不少盐分，所以海水结冰的温度要比一般的淡水低，在冬天也就不太容易结冰了。[48]，海水的流动性很强，这也使得海水不易结冰。"}, {"t": "m", "n": 47, "opts": ["具备", "结合", "含有", "集合"], "ans": "C", "pts": 2.2222222222222223}, {"t": "m", "n": 48, "opts": ["另外", "总共", "至少", "再三"], "ans": "A", "pts": 2.2222222222222223}, {"t": "m", "n": 49, "opts": ["吃亏", "缩短", "破坏", "破产"], "ans": "A", "pts": 2.2222222222222223, "pre": "一位知名人士曾说：“我把钱借给朋友，从来不指望他们还。因为我想，如果他没钱还不了，一定不好意思来；如果他有钱而不想还，也一定不会再来。那么我[49]也就这一次，就当花点儿钱认清了一个坏朋友。朋友借钱，只要数目不大，我都会[50]，因为朋友间应该有通财之谊。至于借出去之后，我从不催讨，是怕伤了[51]的和气。因此，每当我把钱借出去时，总有种既借出去钱，又借出去朋友的感觉。[52]，我便有一种金钱与朋友一起失而复得的感觉。”"}, {"t": "m", "n": 50, "opts": ["提倡", "答应", "转告", "发言"], "ans": "B", "pts": 2.2222222222222223}, {"t": "m", "n": 51, "opts": ["各自", "彼此", "任何", "其余"], "ans": "B", "pts": 2.2222222222222223}, {"t": "m", "n": 52, "opts": ["即使他们不会还钱", "而他们又找我借钱时", "而每当他们把钱还回来时", "虽然我还是会借钱给他们"], "ans": "C", "pts": 2.2222222222222223}, {"t": "m", "n": 53, "opts": ["本质", "规律", "规则", "趋势"], "ans": "A", "pts": 2.2222222222222223, "pre": "熊猫的学名其实是“猫熊”，意思是“像猫一样的熊”，也就是说它[53]上类似于熊，而外貌却像猫。严格地说，“熊猫”是一种错误的称呼。那么这一错误的称呼是怎么来的呢？原来，早年间重庆市北碚博物馆[54]展出过“猫熊”的标本，它的说明牌自左向右横写着“猫熊”两个字。可是，当时报刊的横标题都是自右向左认读的，所以记者们便在[55]中把“猫熊”误写成了“熊猫”。“熊猫”这一称呼经媒体广泛传播后，被人们熟知。人们说惯了，也就很难再纠正过来了。于是，[56]，称“猫熊”为“熊猫”了。"}, {"t": "m", "n": 54, "opts": ["迟早", "照常", "曾经", "一旦"], "ans": "C", "pts": 2.2222222222222223}, {"t": "m", "n": 55, "opts": ["预报", "报道", "辅导", "报到"], "ans": "B", "pts": 2.2222222222222223}, {"t": "m", "n": 56, "opts": ["记者们十分慌张", "大家就将错就错", "人们立刻改正过来", "动物学家不愿承认自己错了"], "ans": "B", "pts": 2.2222222222222223}, {"t": "m", "n": 57, "opts": ["成立", "获得", "存在", "生长"], "ans": "B", "pts": 2.2222222222222223, "pre": "鼓励是一种重要的教育方法，每个人都能在不断地鼓励下[57]自信、勇气和上进心。实践证明，鼓励可以使人心情愉快，而当一个人在愉快的心境下学习时，无论是感觉、知觉，还是思维和记忆力，都会处于最佳[58]。所以，在教育孩子时，可以适当地鼓励孩子，这样做不仅可以增强他们的自信心，使孩子意识到自己的能力，还能提高他们对学习的兴趣，使他们[59]去求知。同样的道理，在工作中，管理者多鼓励员工，[60]，使他们的工作更有效率。"}, {"t": "m", "n": 58, "opts": ["状态", "类型", "形状", "性质"], "ans": "A", "pts": 2.2222222222222223}, {"t": "m", "n": 59, "opts": ["主动", "活跃", "生动", "干脆"], "ans": "A", "pts": 2.2222222222222223}, {"t": "m", "n": 60, "opts": ["提醒他们工作要认真", "给员工提供更好的待遇", "使他们吸取经验和教训", "也会提高员工的工作积极性"], "ans": "D", "pts": 2.2222222222222223}]}, {"h": "第二部分 · 第61–70题", "vi": "Chọn một phương án khớp với nội dung đoạn văn.", "items": [{"t": "m", "n": 61, "opts": ["不宜吃得过饱", "午餐要注意营养均衡", "喝下午茶有助于补充能量", "喝下午茶会加重消化负担"], "ans": "C", "pts": 2.2222222222222223, "stem": "不少人都喜欢喝下午茶，下午茶对补充人体能量大有好处。现代社会生活节奏快，上班族的午餐经常吃得太少或者过于仓促，而一份营养均衡的下午茶，不仅能赶走瞌睡，还有助于恢复体力。"}, {"t": "m", "n": 62, "opts": ["昆虫的分布很广", "昆虫的寿命很短", "昆虫的数量非常有限", "昆虫的飞行速度很快"], "ans": "A", "pts": 2.2222222222222223, "stem": "昆虫是地球上数量最多的动物群体，它们的踪迹几乎遍布世界的每个角落。大多数昆虫都具有高超的飞行技术，能借助飞行来选择适宜的生存环境，寻找食物和同伴。"}, {"t": "m", "n": 63, "opts": ["条形码多为彩色", "电脑无法识别条形码", "条形码提供了很多信息", "条形码可以贴在任意位置上"], "ans": "C", "pts": 2.2222222222222223, "stem": "在许多商品的外包装上，都有一组黑白相间的条形图，这就是条形码。条形码是一种特殊的图形，里面包含了一些和商品有关的信息，如生产国代码、生产厂商代码和商品名称代码等，这些图形只有计算机才能“看”得懂。"}, {"t": "m", "n": 64, "opts": ["活字印刷术已经失传", "活字印刷术成本较高", "活字印刷术提高了印刷效率", "活字印刷术是现代最伟大的发明"], "ans": "C", "pts": 2.2222222222222223, "stem": "活字印刷术是宋朝一个叫毕昇的普通老百姓发明的。这一发明用可以移动的胶泥字块儿代替传统的手工抄写，大大地节省了人们的时间和精力，为知识和文化的传播与交流创造了条件，称得上是人类历史上最伟大的发明之一。"}, {"t": "m", "n": 65, "opts": ["要多走弯路", "常旅行的人心胸开阔", "只赢不输的人生才精彩", "人生的意义在于经历与感悟"], "ans": "D", "pts": 2.2222222222222223, "stem": "生命是一段旅程，而不是一场竞赛。走得一帆风顺固然值得庆幸，但多走几段弯路也未必不是一种收获。多欣赏几段风景，就会多一些生活体验。人生之旅是否有意义、有价值，不在于起点或终点的输赢，也不在于途中的你追我赶，而在于沿途所见的风景，以及内心的那份感受与领悟。"}, {"t": "m", "n": 66, "opts": ["日升昌创办于明朝", "票号是一种古代钱币", "日升昌的业务远及海外", "中国最早的票号位于北京市"], "ans": "C", "pts": 2.2222222222222223, "stem": "票号是清代出现的一种金融机构。中国最早的票号是山西省的日升昌票号，它坐落于平遥古城西大街的繁华地段，是中国现代银行的开山鼻祖。日升昌票号历经百年，分号遍布全国35个大中城市，业务远及欧美、东南亚等，以“汇通天下”而著名。"}, {"t": "m", "n": 67, "opts": ["小麦喜欢紫色光", "光照可延长食物保质期", "阳光越充足农作物产量越高", "合理利用光照可促进农作物增产"], "ans": "D", "pts": 2.2222222222222223, "stem": "科学家们发现植物对光的颜色有选择性，不同的植物喜欢不同颜色的光。这一发现可应用于农业生产上：在红光照射下，小麦发育快，成熟早，辣椒生长快，结果多；在紫光照射下，西红柿能多产40%以上。相信随着科学技术的进步，颜色在农业上的应用也将越来越广泛。"}, {"t": "m", "n": 68, "opts": ["《白鹿原》是短篇小说", "《白鹿原》受到了广泛好评", "《白鹿原》是陈忠实的最后一部作品", "《白鹿原》描写了长江两岸人民的生活"], "ans": "B", "pts": 2.2222222222222223, "stem": "《白鹿原》是中国著名作家陈忠实的代表作。这部近50万字的长篇小说以陕西关中平原上的白鹿村为背景，细致地讲述了白、鹿两大家族之间发生的故事。全书有着厚重的史诗风格和真实感，自出版以来，深受读者的赞赏和欢迎，还曾多次被改编成电影、话剧等。"}, {"t": "m", "n": 69, "opts": ["周庄人不善于经商", "周庄是新兴的江南小镇", "周庄的旅游业不太发达", "周庄旅游以水乡古镇为特色"], "ans": "D", "pts": 2.2222222222222223, "stem": "周庄是一个有着900多年历史的江南古镇。它因灵秀的水乡风貌、独特的人文景观和质朴的民俗风情，被誉为“中国第一水乡”。旅游业是周庄的支柱产业，“周庄水乡古镇游”开创了江南水乡古镇旅游的先河，已成为中国精品旅游路线之一。"}, {"t": "m", "n": 70, "opts": ["陌生人之间很难沟通", "每个人最少要有6个朋友", "六度空间是一个地理概念", "陌生人之间也能建立某种联系"], "ans": "D", "pts": 2.2222222222222223, "stem": "著名的六度空间理论认为：你和任何一个陌生人之间所隔的人不会超过6个，也就是说，最多通过6个人你就能认识任何一个陌生人。这种现象，并不是说一个人与任何陌生人都必须通过6层关系才会产生联系，而是表达了这样一个重要的概念：任何两个素不相识的人，只要通过一定的方式，就能够产生某种联系。"}]}, {"h": "第三部分 · 第71–90题", "vi": "Đọc các đoạn văn và chọn đáp án đúng.", "items": [{"t": "m", "n": 71, "opts": ["很委屈", "心存疑问", "十分发愁", "极不耐烦"], "ans": "B", "pts": 2.2222222222222223, "pre": "沈括小时候上学时，老师在课堂上给同学们朗读了一首白居易的诗。当读到“人间四月芳菲尽，山寺桃花始盛开”这句时，沈括的眉头拧成了一个结，“为什么4月其他地方的花都谢了，山上的桃花才开始盛开呢？”这个问题一直萦绕在沈括的心头，后来他找其他同学讨论，但谁都说不出个所以然来。\n第二天，沈括一行人就前往山里寻找答案。4月的山上，乍暖还寒，凉风袭来，冻得人瑟瑟发抖，沈括茅塞顿开，原来山上的温度要比山下低很多，花季也比山下来得晚，所以山下的桃花都谢了，而山上的桃花还在盛开呢。\n正是有了这种“打破砂锅问到底”的精神，沈括的学问才得以不断地增长。凭借这种求索和实证的精神，长大后的沈括写出了被誉为“中国古代百科全书”的《梦溪笔谈》。", "stem": "“眉头拧成了一个结”是形容沈括："}, {"t": "m", "n": 72, "opts": ["采摘桃子", "体验生活", "寻找诗中所描写的美景", "找出山上开花晚的原因"], "ans": "D", "pts": 2.2222222222222223, "stem": "沈括一行人上山是为了："}, {"t": "m", "n": 73, "opts": ["喜欢冒险", "是一位诗人", "小时候很淘气", "是《梦溪笔谈》的作者"], "ans": "D", "pts": 2.2222222222222223, "stem": "关于沈括，可以知道什么？"}, {"t": "m", "n": 74, "opts": ["要懂得合作", "要学会欣赏", "要有求知精神", "考虑问题要全面"], "ans": "C", "pts": 2.2222222222222223, "stem": "上文主要想告诉我们："}, {"t": "m", "n": 75, "opts": ["抗压性强", "学习能力强", "有很强的适应性", "会吸收别人的情绪"], "ans": "D", "pts": 2.2222222222222223, "pre": "坐在你身旁的同事是否总是不停地抱怨工作环境不好或是工作压力太大？在他们抱怨时，你是否会耐心地倾听呢？如果是，那你可不只是在听别人讲而已。事实上，在倾听的过程中，你也会不知不觉地被他们的压力所“传染”。\n心理学家发现，压力就像感冒一样会传染，这种“二手”的压力和焦虑情绪可以在工作场所迅速蔓延。因为人们能够以惊人的速度模仿他人的面部表情、声音和姿势，从而对他人的情绪感同身受。我们其实都是“海绵”，可以吸收周围人散发出的感染性的情绪。而在吸收他人压力的同时，我们自己也开始感受到压力，并会不自觉地去关注那些可能会困扰我们的问题。\n为什么别人的压力会传染给我们？这是因为，一方面，我们吸收朋友或同事的压力是为了和他们打成一片；另一方面，持续灌进我们耳中的不满的声音，也会让我们开始产生消极的想法。\n研究者发现，我们不仅会接受他人消极的思维模式，还会下意识地模仿他们在压力下的身体语言，这导致我们在交谈时会与他们一样弓起背、皱起眉。另外，女性遭遇“二手压力”的风险更大，因为她们往往更容易与他人产生共鸣。", "stem": "为什么说“我们其实都是‘海绵’”？"}, {"t": "m", "n": 76, "opts": ["争论", "打架", "搞好关系", "相互支持"], "ans": "C", "pts": 2.2222222222222223, "stem": "第3段中的“打成一片”，是什么意思？"}, {"t": "m", "n": 77, "opts": ["女性喜欢模仿", "身体语言与年龄有关", "人的思维方式很难改变", "女性更容易受他人影响"], "ans": "D", "pts": 2.2222222222222223, "stem": "根据第4段，下列哪项正确？"}, {"t": "m", "n": 78, "opts": ["海绵效应", "倾诉的力量", "会传染的压力", "你能读懂表情吗"], "ans": "C", "pts": 2.2222222222222223, "stem": "最适合做上文标题的是："}, {"t": "m", "n": 79, "opts": ["做笛子", "种竹子", "教他吹笛子", "辨别竹子的好坏"], "ans": "A", "pts": 2.2222222222222223, "pre": "有年夏天，家里来了一个会制作笛子的木匠，在我家干了半个月的活儿。一天，我到山上砍了根竹子，请他帮我做一支笛子。他苦笑道：“不是每根竹子都能做成笛子的。”我觉得他是在骗我，我找的那根竹子粗细适宜，厚薄均匀，质感光滑，竹节也不明显，是我千挑万选才相中的，为什么不能做成笛子呢？\n他解释说：“这是今年的竹子，就算做成了笛子，也经不起吹奏。”我更加困惑了：今年的竹子怎么了？难道非要放旧了再拿来做？东西不都是越新鲜越好吗？他看出了我的困惑，接着讲道：“你不知道，凡是用来做笛子的竹子都需要经历寒冬。因为竹子在春夏长得太散漫，只有到了冬天，气温骤冷，天天‘风刀霜剑严相逼’，它的质地才会改变，做成笛子吹起来才不会走调。而当年生的竹子，没有经过霜冻雪侵，虽然看起来长得不错，可是用来制作笛子的话，不但音色会差许多，而且还会出现小裂痕，虫子也很喜欢蛀这样的竹子。”\n其实，人生就好比是这根用来做笛子的竹子，只有历经了风霜雨雪、千锤百炼，才能奏出动人的曲子。", "stem": "作者请木匠帮什么忙？"}, {"t": "m", "n": 80, "opts": ["木匠技术太差", "木匠态度不好", "他认为自己找的竹子很好", "他见木匠答应了别人的请求"], "ans": "C", "pts": 2.2222222222222223, "stem": "作者为什么觉得木匠在骗他？"}, {"t": "m", "n": 81, "opts": ["少有裂痕", "不够粗壮", "表面更光滑", "不适合做建筑材料"], "ans": "A", "pts": 2.2222222222222223, "stem": "经历过寒冬的竹子："}, {"t": "m", "n": 82, "opts": ["要抓住机会", "苦难会使人成长", "不要轻易否定他人", "要保持乐观的心态"], "ans": "B", "pts": 2.2222222222222223, "stem": "上文主要想告诉我们什么？"}, {"t": "m", "n": 83, "opts": ["年代久远", "转卖过多次", "房屋合同丢了", "曾属于两家共有"], "ans": "A", "pts": 2.2222222222222223, "pre": "清朝康熙年间，一户姓张的人家和一户姓吴的人家相邻。两家中间有三尺空地，由于他们的房子都是祖上留下的产业，时间久远，这三尺空地究竟属于哪家，谁也不清楚。\n后来，吴家重修房子，想要占用那三尺空地，张家不同意，说这三尺空地是他们家的，吴家则认为是自己的，两家为此争执不下。于是，张家给在京城做大官的亲戚张英去了一封信，说明了情况，希望张英可以为张家做主。\n不料张英不但没压制吴家，反而让自己家人让出这三尺空地。张英在信中写道：“千里修书只为墙，让他三尺又何妨？万里长城今犹在，不见当年秦始皇。”张家人读了信后觉得很惭愧，于是主动登门拜访吴家，并把三尺空地让了出来。吴家被张英的大度谦让所感动，在重修房屋时，也让出了三尺地，这样两家之间就空出了一条足有六尺宽的巷子，人称“六尺巷”。张英大度谦让地处理邻里财产纠纷的事情也被传为千古佳话。\n六尺巷只有百米长，但留给人们的思考却很多。俗话说：“退一步天高海阔，让三分心平气和。”谦让、忍让虽然可能会使我们暂时失去面子，失去利益，但却可以让我们拥有优雅的风度和平和的心境。其实，得与失总是相对平衡的，我们失去的，往往会以另一种形式得到补偿。让，是一种修养，是一种美德，也是一种人生的至高境界。", "stem": "为什么两家不清楚空地该归谁？"}, {"t": "m", "n": 84, "opts": ["让出空地", "向吴家道歉", "把空地卖给吴家", "和吴家共同开发空地"], "ans": "A", "pts": 2.2222222222222223, "stem": "张英希望张家怎么做？"}, {"t": "m", "n": 85, "opts": ["张家得到了赔偿", "两家的矛盾更深了", "吴家最后没重修房子", "张英的做法受到了人们赞赏"], "ans": "D", "pts": 2.2222222222222223, "stem": "根据上文，下列哪项正确？"}, {"t": "m", "n": 86, "opts": ["要懂得谦让", "要勇于承担责任", "幸福要靠自己争取", "邻里之间要互相帮助"], "ans": "A", "pts": 2.2222222222222223, "stem": "上文主要想告诉我们："}, {"t": "m", "n": 87, "opts": ["躲在洞里", "倒挂在树枝上", "“坐”在树枝上", "东倒西歪地躺着"], "ans": "C", "pts": 2.2222222222222223, "pre": "人类习惯躺着睡觉，即使在某些特殊情况下能坐着入睡，但也总会睡得东倒西歪的。与人类不同，鸟类大都是以双足紧扣树枝的方式“坐”在数米高的树上睡觉的，而且从不会跌落下来。这是为什么呢？\n一位鸟类学家解释说，人类和鸟类的肌肉作用方式有很大的区别，尤其是在进行“抓”这一动作时，更是完全相反。两者相比较，人类是主动地去抓，鸟类则是被动地去抓。当人类想要抓住某样东西的时候，需要用力使肌肉紧张起来。而鸟类只有在要松开所抓的物体时，肌肉才会紧张起来。也就是说，当鸟类飞离树枝时，其爪子的肌肉呈紧张状态，而当它“坐”稳之后，肌肉便松弛下来，爪子就自然地抓住树枝了。\n这位鸟类学家还介绍说，不同的鸟睡眠时间也不大相同。鸫属的鸟基本上一天只睡一到三个小时；啄木鸟等穴洞孵卵鸟类睡眠时间最长，大约要睡6个小时。另外，他还指出，同人类相比，鸟类没有“深度睡眠”这一阶段，它们所谓的睡眠只是进入了一种“安静的状态”而已，因为它们必须警惕随时可能出现的天敌，以便及时地飞走逃生。", "stem": "鸟类大多是怎样睡觉的？"}, {"t": "m", "n": 88, "opts": ["饮食习惯不同", "骨骼构成不同", "大脑结构不同", "肌肉作用方式不同"], "ans": "D", "pts": 2.2222222222222223, "stem": "人类和鸟类的睡眠方式不同，是因为："}, {"t": "m", "n": 89, "opts": ["很多鸟喜欢在白天睡觉", "啄木鸟的睡眠时间很长", "鸫属的鸟每天要睡6小时", "鸟类的睡眠时间和季节有关"], "ans": "B", "pts": 2.2222222222222223, "stem": "根据第3段，下列哪项正确？"}, {"t": "m", "n": 90, "opts": ["为了保存体力", "为了保持警觉", "周围环境太吵", "怕错过捕食时间"], "ans": "B", "pts": 2.2222222222222223, "stem": "鸟类为什么没有“深度睡眠”？"}]}]};

const SEC=C.sections,IT=SEC.flatMap(s=>s.items),N=IT.length;
let S=null,cur=0,done=false,tid;
const han=s=>(String(s||"").match(/[\u4e00-\u9fff]/g)||[]).length;
const st=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ld=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const ans=it=>{const v=S.a[it.n];return it.t=="m"?!!v:it.t=="o"?(v||[]).length==it.words.length:han(v)>=30};
$("#ti").textContent=C.cn+" · "+C.vi;
$("#notes").innerHTML=C.notes.concat(["Thời gian làm bài: <b>"+MIN+" phút</b>. Hết giờ bài tự động được nộp.","Trong lúc làm <b>không hiện đúng/sai</b>. Bài được tự lưu trên máy; nếu mất mạng hay tải lại trang, bấm “Tiếp tục bài đang làm”.","Nộp xong sẽ có bảng điểm in tên em. <b>Chụp màn hình bảng điểm (hoặc bấm “Sao chép kết quả”) gửi giảng viên.</b>"]).map(x=>"<li>"+x+"</li>").join("");
const old=ld();if(old&&!old.sub){$("#resume").hidden=false;$("#rname").textContent="– "+old.name+" ("+old.id+")"}
function err(m){$("#err").textContent=m;$("#err").hidden=false}
$("#go").onclick=()=>{const name=$("#f-name").value.trim().replace(/\s+/g," "),id=$("#f-id").value.trim(),cls=$("#f-cls").value.trim();
if(name.split(" ").length<2)return err("Nhập đầy đủ họ và tên (ít nhất 2 từ).");
if(id.length<4)return err("Nhập mã sinh viên.");
S={name,id,cls,start:Date.now(),end:Date.now()+MIN*60000,a:{},sub:false};st();run()};
$("#rbtn").onclick=()=>{S=old;run();if(S.end<=Date.now())submit(true)};
function run(){$("#intro").hidden=true;$("#exam").hidden=false;$("#who").textContent=S.name+" · "+S.id;tick();tid=setInterval(tick,1000);show(0)}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000));$("#tm").textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");$("#tm").classList.toggle("low",r<300);if(r<=0)submit(true)}
function render(){const s=SEC[cur];
$("#chips").innerHTML=SEC.map((x,i)=>`<button class="chip${i==cur?" on":""}" data-i="${i}">Phần ${i+1}<small>${x.items.filter(ans).length}/${x.items.length}</small></button>`).join("");
$("#prog").textContent="Đã làm "+IT.filter(ans).length+"/"+N+" câu";
$("#prev").disabled=cur==0;$("#next").textContent=cur==SEC.length-1?"Nộp bài":"Phần tiếp →";
let h=`<div class="eyebrow">Phần ${cur+1}/${SEC.length}</div><h2 class="cn">${s.h}</h2><p class="mu">${s.vi}</p>`;
s.items.forEach(it=>{const n=it.n,v=S.a[n];
if(it.pre)h+=`<div class="pa">${esc(it.pre).replace(/\[(\d+)\]/g,"（<b>$1</b>）")}</div>`;
h+=`<div class="q"><div class="qn">${n}</div><div class="qb">`;
if(it.stem)h+=`<div class="stem">${esc(it.stem)}</div>`;
if(it.img)h+=`<img class="pic" src="${it.img}" alt="">`;
if(it.hint)h+=`<div class="mu">${esc(it.hint)}</div>`;
if(it.t=="m")h+=it.opts.map((t,j)=>`<button class="opt${v==L[j]?" on":""}" data-n="${n}" data-v="${L[j]}"><b>${L[j]}</b><span class="cn">${esc(t)}</span></button>`).join("");
else if(it.t=="o"){const u=v||[];h+=`<div class="pool">`+it.words.map((t,j)=>`<button class="w wp" data-n="${n}" data-j="${j}"${u.includes(j)?" disabled":""}>${esc(t)}</button>`).join("")+`</div><div class="ans">`+u.map(j=>`<button class="w wa" data-n="${n}" data-j="${j}">${esc(it.words[j])}</button>`).join("")+`</div>`}
else h+=`<textarea data-n="${n}" placeholder="Viết đoạn văn ở đây…">${esc(v||"")}</textarea><div class="mu" id="cc${n}">${han(v)} 字</div>`;
h+=`</div></div>`});
$("#sec").innerHTML=h}
function show(i){cur=i;$("#confirm").hidden=true;render();window.scrollTo(0,0)}
$("#chips").onclick=e=>{const b=e.target.closest("[data-i]");if(b&&!done)show(+b.dataset.i)};
$("#sec").onclick=e=>{const b=e.target.closest("button");if(!b||done)return;const n=+b.dataset.n;
if(b.classList.contains("opt"))S.a[n]=b.dataset.v;
else if(b.classList.contains("wp"))(S.a[n]=S.a[n]||[]).push(+b.dataset.j);
else if(b.classList.contains("wa"))S.a[n]=S.a[n].filter(x=>x!=+b.dataset.j);
else return;st();render()};
$("#sec").oninput=e=>{if(e.target.tagName!="TEXTAREA")return;const n=+e.target.dataset.n;S.a[n]=e.target.value;st();$("#cc"+n).textContent=han(e.target.value)+" 字";$("#prog").textContent="Đã làm "+IT.filter(ans).length+"/"+N+" câu"};
$("#prev").onclick=()=>show(cur-1);
$("#next").onclick=()=>{if(cur<SEC.length-1)return show(cur+1);
const miss=IT.filter(it=>!ans(it)).map(i=>i.n);
$("#cmsg").innerHTML=miss.length?`<b>Còn ${miss.length} câu chưa làm:</b> ${miss.join(", ")}. Câu bỏ trống tính 0 điểm.`:"<b>Em đã làm đủ.</b> Nộp xong sẽ không sửa được nữa.";
$("#confirm").hidden=false;$("#confirm").scrollIntoView({block:"center"})};
$("#back").onclick=()=>{$("#confirm").hidden=true};
$("#sub").onclick=()=>submit(false);
window.addEventListener("beforeunload",e=>{if(S&&!done){e.preventDefault();e.returnValue=""}});
function code(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(7,"0")}
function submit(auto){if(done)return;done=true;clearInterval(tid);const now=Date.now();S.sub=true;st();
let sc=0,max=0,ok=0,no=0,bl=0,rows="",pick=[];
IT.forEach(it=>{const n=it.n,v=S.a[n];
if(it.t=="e"){const t=v||"",miss=(it.must||[]).filter(w=>!t.includes(w));
rows+=`<div class="rv"><b>${n}.</b> <span class="pill bl">Chờ giảng viên chấm · tối đa ${it.pts} điểm</span> ${han(t)} chữ Hán${it.must?(miss.length?" · thiếu từ: "+esc(miss.join("、")):" · đủ 5 từ yêu cầu"):""}<pre>${esc(t)||"(bỏ trống)"}</pre></div>`;pick.push(n+":\n"+t);return}
let mine,right,rt;
if(it.t=="m"){mine=v||"";right=it.ans;rt=right+" "+it.opts[L.indexOf(right)]}else{mine=(v||[]).map(j=>it.words[j]).join("");right=it.key;rt=right+"。"}
max+=it.pts;const g=mine&&mine===right;
if(g){sc+=it.pts;ok++}else if(mine)no++;else bl++;
pick.push(n+(it.t=="m"?mine:": "+mine));
rows+=`<div class="rv"><b>${n}.</b> <span class="pill ${g?"ok":mine?"no":"bl"}">${g?"Đúng":mine?"Sai":"Bỏ trống"}</span> Em: <span class="cn">${esc(mine||"—")}</span>${g?"":` · Đáp án: <b class="cn">${esc(rt)}</b>`}</div>`});
const used=Math.max(1,Math.round((now-S.start)/60000)),when=new Date(now).toLocaleString("vi-VN"),cd=code([S.name,S.id,sc.toFixed(1),now].join("|"));
const part=max<99.5,sum=`${C.cn} · ${C.vi}\nHọ tên: ${S.name}\nMSSV: ${S.id}\nLớp: ${S.cls||"-"}\nNộp lúc: ${when}${auto?" (hết giờ, tự nộp)":""}\nThời gian làm: ${used} phút\nĐúng ${ok} · Sai ${no} · Bỏ trống ${bl}\nĐiểm tự chấm: ${sc.toFixed(1)}/${max.toFixed(0)}${part?" (bài viết 99–100 chờ giảng viên chấm, "+(100-max).toFixed(0)+" điểm)":""}\nMã bài làm: ${cd}\n\n`+pick.join("\n");
$("#exam").hidden=true;const r=$("#result");r.hidden=false;
r.innerHTML=`<div class="sheet rs"><div class="wm"></div><div class="in"><div class="eyebrow">${esc(C.cn)} · ${esc(C.vi)}</div>${auto?'<p class="mu"><b>Hết giờ – bài đã được tự động nộp.</b></p>':""}
<div class="big">${sc.toFixed(1)} / ${part?max.toFixed(0)+" (tự chấm)":"100"}</div>${part?`<div class="mu">Tổng 100 điểm = ${max.toFixed(0)} điểm tự chấm + ${(100-max).toFixed(0)} điểm bài viết do giảng viên chấm.</div>`:""}
<p><b>${esc(S.name)}</b> · MSSV: <b>${esc(S.id)}</b>${S.cls?" · Lớp: <b>"+esc(S.cls)+"</b>":""}<br>Nộp lúc ${when} · làm trong ${used} phút<br>Đúng ${ok} · Sai ${no} · Bỏ trống ${bl}</p>
<button class="btn p" id="cp">Sao chép kết quả</button><button class="btn" id="nw">Làm bài mới</button>
<div class="stamp">Mã bài làm: <b>${cd}</b> · Chụp toàn bộ khung này gửi giảng viên.</div></div></div><div class="sheet"><h2>Chi tiết bài làm</h2>${rows}</div>`;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170"><text x="12" y="95" font-size="16" fill="gray" fill-opacity=".16" font-family="sans-serif" transform="rotate(-20 160 85)">${esc(S.name)} · ${esc(S.id)}</text></svg>`;
$(".wm").style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
$("#cp").onclick=()=>{try{navigator.clipboard.writeText(sum)}catch(e){}$("#cp").textContent="Đã sao chép"};
$("#nw").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
window.scrollTo(0,0)}
</script></body></html>
