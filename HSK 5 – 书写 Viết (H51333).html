const $=s=>document.querySelector(s),L="ABCD",KEY="hsk5:"+C.id;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm=(location.hash.match(/m(\d+)/)||[])[1],MIN=+mm||C.min;
const SEC=C.sections,IT=SEC.flatMap(s=>s.items),N=IT.length;
let S=null,cur=0,done=false,tid;
const han=s=>(String(s||"").match(/[\u4e00-\u9fff]/g)||[]).length;
const st=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ld=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const ans=it=>{const v=S.a[it.n];return it.t=="m"?!!v:it.t=="o"?(v||[]).length==it.words.length:han(v)>=30};
$("#ti").textContent=C.cn+" · "+C.vi;
$("#notes").innerHTML=C.notes.concat(["Thời gian làm bài: <b>"+MIN+" phút</b>. Hết giờ bài tự động được nộp.","Trong lúc làm <b>không hiện đúng/sai</b>. Bài được tự lưu trên máy; nếu mất mạng hay tải lại trang, bấm “Tiếp tục bài đang làm”.","Nộp xong sẽ có bảng điểm in tên em. <b>Chụp màn hình bảng điểm (hoặc bấm “Sao chép kết quả”) gửi giảng viên.</b>"]).map(x=>"<li>"+x+"</li>").join("");
const old=ld();if(old&&!old.sub){$("#resume").hidden=false;$("#rname").textContent="– "+old.name+" ("+old.id+")"}
function err(m){$("#err").textContent=m;$("#err").hidden=false}
$("#go").onclick=()=>{const name=$("#f-name").value.trim().replace(/\s+/g," "),id=$("#f-id").value.trim(),cls=$("#f-cls").value.trim();
if(name.split(" ").length<2)return err("Nhập đầy đủ họ và tên (ít nhất 2 từ).");
if(id.length<4)return err("Nhập mã sinh viên.");
S={name,id,cls,start:Date.now(),end:Date.now()+MIN*60000,a:{},sub:false};st();run()};
$("#rbtn").onclick=()=>{S=old;run();if(S.end<=Date.now())submit(true)};
function run(){$("#intro").hidden=true;$("#exam").hidden=false;$("#who").textContent=S.name+" · "+S.id;tick();tid=setInterval(tick,1000);show(0)}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000));$("#tm").textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");$("#tm").classList.toggle("low",r<300);if(r<=0)submit(true)}
function render(){const s=SEC[cur];

let h=`<div class="eyebrow">Phần ${cur+1}/${SEC.length}</div><h2 class="cn">${s.h}</h2><p class="mu">${s.vi}</p>`;
s.items.forEach(it=>{const n=it.n,v=S.a[n];
if(it.pre)h+=`<div class="pa">${esc(it.pre).replace(/\[(\d+)\]/g,"（<b>$1</b>）")}</div>`;
h+=`<div class="q"><div class="qn">${n}</div><div class="qb">`;
if(it.stem)h+=`<div class="stem">${esc(it.stem)}</div>`;
if(it.img)h+=`<img class="pic" src="${it.img}" alt="">`;
if(it.hint)h+=`<div class="mu">${esc(it.hint)}</div>`;
if(it.t=="m")h+=it.opts.map((t,j)=>`<button class="opt${v==L[j]?" on":""}" data-n="${n}" data-v="${L[j]}"><b>${L[j]}</b><span class="cn">${esc(t)}</span></button>`).join("");
else if(it.t=="o"){const u=v||[];h+=`<div class="pool">`+it.words.map((t,j)=>`<button class="w wp" data-n="${n}" data-j="${j}"${u.includes(j)?" disabled":""}>${esc(t)}</button>`).join("")+`</div><div class="ans">`+u.map(j=>`<button class="w wa" data-n="${n}" data-j="${j}">${esc(it.words[j])}</button>`).join("")+`</div>`}
else h+=`<textarea data-n="${n}" placeholder="Viết đoạn văn ở đây…">${esc(v||"")}</textarea><div class="mu" id="cc${n}">${han(v)} 字</div>`;
h+=`</div></div>`});
$("#sec").innerHTML=h}
function show(i){cur=i;$("#confirm").hidden=true;render();window.scrollTo(0,0)}
$("#chips").onclick=e=>{const b=e.target.closest("[data-i]");if(b&&!done)show(+b.dataset.i)};
$("#sec").onclick=e=>{const b=e.target.closest("button");if(!b||done)return;const n=+b.dataset.n;
if(b.classList.contains("opt"))S.a[n]=b.dataset.v;
else if(b.classList.contains("wp"))(S.a[n]=S.a[n]||[]).push(+b.dataset.j);
else if(b.classList.contains("wa"))S.a[n]=S.a[n].filter(x=>x!=+b.dataset.j);
else return;st();render()};
$("#sec").oninput=e=>{if(e.target.tagName!="TEXTAREA")return;const n=+e.target.dataset.n;S.a[n]=e.target.value;st();$("#cc"+n).textContent=han(e.target.value)+" 字";$("#prog").textContent="Đã làm "+IT.filter(ans).length+"/"+N+" câu"};
$("#prev").onclick=()=>show(cur-1);
$("#next").onclick=()=>{if(cur<SEC.length-1)return show(cur+1);
const miss=IT.filter(it=>!ans(it)).map(i=>i.n);
$("#cmsg").innerHTML=miss.length?`<b>Còn ${miss.length} câu chưa làm:</b> ${miss.join(", ")}. Câu bỏ trống tính 0 điểm.`:"<b>Em đã làm đủ.</b> Nộp xong sẽ không sửa được nữa.";
$("#confirm").hidden=false;$("#confirm").scrollIntoView({block:"center"})};
$("#back").onclick=()=>{$("#confirm").hidden=true};
$("#sub").onclick=()=>submit(false);
window.addEventListener("beforeunload",e=>{if(S&&!done){e.preventDefault();e.returnValue=""}});
function code(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(7,"0")}
function submit(auto){if(done)return;done=true;clearInterval(tid);const now=Date.now();S.sub=true;st();
let sc=0,max=0,ok=0,no=0,bl=0,rows="",pick=[];
IT.forEach(it=>{const n=it.n,v=S.a[n];
if(it.t=="e"){const t=v||"",miss=(it.must||[]).filter(w=>!t.includes(w));
rows+=`<div class="rv"><b>${n}.</b> <span class="pill bl">Chờ giảng viên chấm · tối đa ${it.pts} điểm</span> ${han(t)} chữ Hán${it.must?(miss.length?" · thiếu từ: "+esc(miss.join("、")):" · đủ 5 từ yêu cầu"):""}<pre>${esc(t)||"(bỏ trống)"}</pre></div>`;pick.push(n+":\n"+t);return}
let mine,right,rt;
if(it.t=="m"){mine=v||"";right=it.ans;rt=right+" "+it.opts[L.indexOf(right)]}else{mine=(v||[]).map(j=>it.words[j]).join("");right=it.key;rt=right+"。"}
max+=it.pts;const g=mine&&mine===right;
if(g){sc+=it.pts;ok++}else if(mine)no++;else bl++;
pick.push(n+(it.t=="m"?mine:": "+mine));
rows+=`<div class="rv"><b>${n}.</b> <span class="pill ${g?"ok":mine?"no":"bl"}">${g?"Đúng":mine?"Sai":"Bỏ trống"}</span> Em: <span class="cn">${esc(mine||"—")}</span>${g?"":` · Đáp án: <b class="cn">${esc(rt)}</b>`}</div>`});
const used=Math.max(1,Math.round((now-S.start)/60000)),when=new Date(now).toLocaleString("vi-VN"),cd=code([S.name,S.id,sc.toFixed(1),now].join("|"));
const part=max<99.5,sum=`${C.cn} · ${C.vi}\nHọ tên: ${S.name}\nMSSV: ${S.id}\nLớp: ${S.cls||"-"}\nNộp lúc: ${when}${auto?" (hết giờ, tự nộp)":""}\nThời gian làm: ${used} phút\nĐúng ${ok} · Sai ${no} · Bỏ trống ${bl}\nĐiểm tự chấm: ${sc.toFixed(1)}/${max.toFixed(0)}${part?" (bài viết 99–100 chờ giảng viên chấm, "+(100-max).toFixed(0)+" điểm)":""}\nMã bài làm: ${cd}\n\n`+pick.join("\n");
$("#exam").hidden=true;const r=$("#result");r.hidden=false;
r.innerHTML=`<div class="sheet rs"><div class="wm"></div><div class="in"><div class="eyebrow">${esc(C.cn)} · ${esc(C.vi)}</div>${auto?'<p class="mu"><b>Hết giờ – bài đã được tự động nộp.</b></p>':""}
<div class="big">${sc.toFixed(1)} / ${part?max.toFixed(0)+" (tự chấm)":"100"}</div>${part?`<div class="mu">Tổng 100 điểm = ${max.toFixed(0)} điểm tự chấm + ${(100-max).toFixed(0)} điểm bài viết do giảng viên chấm.</div>`:""}
<p><b>${esc(S.name)}</b> · MSSV: <b>${esc(S.id)}</b>${S.cls?" · Lớp: <b>"+esc(S.cls)+"</b>":""}<br>Nộp lúc ${when} · làm trong ${used} phút<br>Đúng ${ok} · Sai ${no} · Bỏ trống ${bl}</p>
<button class="btn p" id="cp">Sao chép kết quả</button><button class="btn" id="nw">Làm bài mới</button>
<div class="stamp">Mã bài làm: <b>${cd}</b> · Chụp toàn bộ khung này gửi giảng viên.</div></div></div><div class="sheet"><h2>Chi tiết bài làm</h2>${rows}</div>`;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170"><text x="12" y="95" font-size="16" fill="gray" fill-opacity=".16" font-family="sans-serif" transform="rotate(-20 160 85)">${esc(S.name)} · ${esc(S.id)}</text></svg>`;
$(".wm").style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
$("#cp").onclick=()=>{try{navigator.clipboard.writeText(sum)}catch(e){}$("#cp").textContent="Đã sao chép"};
$("#nw").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
window.scrollTo(0,0)}
</script></body></html>
